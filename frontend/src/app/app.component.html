<div class="app-container">
  <div *ngIf="!isAuthenticated" class="login-prompt">
    <h1>Welcome to Nepse Trader</h1>
    <p>Please log in to access the application.</p>
    <button class="login-btn" (click)="window.location.href='http://localhost:8000/login'">
      Go to Login
    </button>
  </div>

  <div *ngIf="isAuthenticated">
    <h1>Nepse Trader</h1>
    <p>Python backend + Angular frontend demo.</p>

    <button (click)="fetchMessage()" [disabled]="loading">
      {{ loading ? 'Loading...' : 'Fetch Backend Message' }}
    </button>

    <div *ngIf="message" class="result">
      <h2>{{ message.title }}</h2>
      <p>{{ message.text }}</p>
      <p><strong>Fetched count:</strong> {{ message.count }}</p>
    </div>

    <div *ngIf="error" class="error">
      {{ error }}
    </div>

    <div class="logout-section">
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </div>
</div>
